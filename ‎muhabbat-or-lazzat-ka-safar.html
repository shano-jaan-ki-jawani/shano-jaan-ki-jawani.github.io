<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محبت اور لذت کا سفر</title>
<style>
body{background:#000; margin:0; padding:10px; font-family: Jameel Noori Nastaleeq, sans-serif;}
.main-box{max-width:700px; margin:15px auto; background:#0a0a0a; border:2px solid #ff0066; border-radius:15px; overflow:hidden; box-shadow: 0 0 15px #ff006633;}
/* فوٹو کاپی بند */
.no-copy-img{width:100%; height:400px; object-fit:cover; display:block; pointer-events:none; -webkit-user-select:none; user-select:none;}
/* کہانی کا متن صرف سفید اور کاپی بند */
.story-text{color:#ffffff !important; font-size:18px; line-height:2; padding:20px; text-align:justify; -webkit-user-select:none; user-select:none; -moz-user-select:none; -ms-user-select:none;}
.story-text p{color:#ffffff !important; margin-bottom:15px;}
</style>
</head>
<body oncontextmenu="return false">

<div class="main-box">
  <!-- تھمب نیل لنک -->
  <img src="IMG-20261015-WA9356.jpg" class="no-copy-img" alt="محبت اور لذت کا سفر">

  <h1 style="color:gold; text-align:center; padding:15px 10px 5px 10px; margin:0; font-size:26px;">محبت اور لذت کا سفر</h1>

  <!-- کہانی کا متن - صرف سفید -->
  <div class="story-text" oncopy="return false" oncut="return false">
    <p>ہیلو میرے پیارے دوستو! میرا نام آریان ہے۔ میں آج آپ سب کے سامنے اپنی زندگی کا ایک ایسا حصہ لایا ہوں جو شاید آپ نے پہلے کبھی نہ سنا ہو۔ میں یہاں آپ کے ساتھ اپنی ایک ایسی کہانی شیئر کرنے آیا ہوں جو صرف ایک کہانی نہیں، بلکہ میری اپنی حقیقت ہے۔</p>
  </div>

  <!-- لائک کمنٹ بٹن ویسے ہی رہیں گے -->
  <div style="padding:15px; border-top:1px solid #2a0a3a; display:flex; justify-content:space-around; align-items:center;">
    <button style="background:#1a1a1a; color:#ff0066; border:1px solid #ff0066; padding:8px 20px; border-radius:20px; cursor:pointer;">❤️ Like</button>
    <button style="background:#1a1a1a; color:gold; border:1px solid gold; padding:8px 20px; border-radius:20px; cursor:pointer;">💬 Comment</button>
    <button style="background:#1a1a1a; color:#fff; border:1px solid #fff; padding:8px 20px; border-radius:20px; cursor:pointer;">🔗 Share</button>
  </div>

</div>

<script>
// کاپی پیسٹ مکمل بند
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
</script>

</body>
</html>
