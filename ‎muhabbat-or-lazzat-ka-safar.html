<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محبت اور لذت کا سفر</title>
<style>
body{background:#000; margin:0; padding:15px; font-family: sans-serif;}
.main-card{max-width:400px; margin:20px auto; background:#0a0a0a; border:1.5px solid #ff0066; border-radius:18px; overflow:hidden; padding-bottom:20px; text-align:center;}
.no-select{user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;}
.story-img{width:100%; height:auto; display:block; pointer-events:none; -webkit-user-drag:none; user-select:none;}
.title{color:#ffeb3b; font-size:26px; font-weight:bold; margin:15px 0;}
.views-badge{border:1px solid #c9a600; color:#e6b800; border-radius:20px; padding:6px 18px; display:inline-block; font-size:14px; margin-bottom:12px;}
.like-btn{background:#e91e63; color:#fff; padding:8px 25px; border-radius:20px; display:inline-block; font-size:15px; border:none; margin-bottom:15px;}
.story-text{color:#ffffff !important; font-size:16px; line-height:28px; padding:0 15px; text-align:right; user-select:none; -webkit-user-select:none;}
</style>
<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => {
  if(e.target.closest('.story-text') || e.target.closest('.story-img')){ e.preventDefault(); }
});
document.addEventListener('copy', e => e.preventDefault());
</script>
</head>
<body>

<div class="main-card">
<img src="muhabbat-or-lazzat-ka.jpeg" alt="محبت اور لذت کا سفر" class="story-img no-select" oncontextmenu="return false">

<div class="title">محبت اور لذت کا سفر</div>

<div class="views-badge">👁️ Views | 🔥 Trending 14,016</div>
<br>
<div class="like-btn">🧡 Like 0</div>

<div class="story-text no-select" oncontextmenu="return false">
ہیلو میرے پیارے دوستو! میرا نام آریان ہے۔ میں آج آپ سب کے سامنے اپنی زندگی کا ایک ایسا حصہ لایا ہوں جو شاید آپ نے پہلے کبھی نہ سنا ہو۔ میں یہاں آپ کے ساتھ اپنی ایک ایسی کہانی شیئر کرنے آیا ہوں جو صرف ایک کہانی نہیں، بلکہ میری اپنی حقیقت ہے۔
</div>

</div>

</body>
</html>
