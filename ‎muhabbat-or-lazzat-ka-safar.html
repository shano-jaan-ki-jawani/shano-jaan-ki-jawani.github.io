<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محبت اور لذت کا سفر</title>
<style>
body{background:#0a0a0a; margin:0; font-family:sans-serif;}
.box{max-width:700px; margin:auto; background:#000; padding:15px;}
img{width:100%; border-radius:12px; pointer-events:none; user-select:none;}
.story{color:#ffffff !important; font-size:17px; line-height:30px; user-select:none; -webkit-user-select:none;}
.story p{color:#ffffff !important;}
</style>
<script>
document.addEventListener('contextmenu',e=>{ if(e.target.closest('.story')||e.target.tagName=='IMG') e.preventDefault(); });
document.addEventListener('copy',e=>e.preventDefault());
</script>
</head>
<body>
<div class="box">
<img src="IMG-20261015-WA9356.jpg">
<div class="story" oncopy="return false">
<h2 style="color:#fff; text-align:center;">محبت اور لذت کا سفر</h2>
<p>ہیلو میرے پیارے دوستو! میرا نام آریان ہے۔ میں آج آپ سب کے سامنے اپنی زندگی کا ایک ایسا حصہ لایا ہوں جو شاید آپ نے پہلے کبھی نہ سنا ہو۔ میں یہاں آپ کے ساتھ اپنی ایک ایسی کہانی شیئر کرنے آیا ہوں جو صرف ایک کہانی نہیں، بلکہ میری اپنی حقیقت ہے۔</p>
<p>یہاں اپنی باقی کہانی لکھو...</p>
</div>
</div>
</body>
</html>
