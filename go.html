<!DOCTYPE html>
<html>
<head>

<style>
body{margin:0;font-family:sans-serif;background:#fff;text-align:center}
.top{padding:15px;background:#f0f0f0;font-size:14px}
#timer{font-size:22px;font-weight:bold;color:green;margin:20px}
.ad-box{min-height:250px;display:flex;align-items:center;justify-content:center;background:#fafafa;border:1px dashed #ccc;margin:10px}
</style>
</head>
<body>

<div class="top">اشتہار ختم ہونے کے بعد کہانی خود کھل جائے گی</div>

<div class="ad-box">
  <!-- یہاں تمہارا Pop ایڈ خود لوڈ ہوگا -->
  <p>اشتہار لوڈ ہو رہا ہے...</p>
</div>

<div id="timer">کہانی 5 سیکنڈ میں کھلے گی...</div>

<script>
const s = new URLSearchParams(window.location.search).get('s');
const storyUrl = "https://shano-jaan-ki-jawani.github.io/" + s;
let sec = 5;
const t = document.getElementById('timer');

const interval = setInterval(()=>{
  sec--;
  t.innerHTML = "کہانی " + sec + " سیکنڈ میں کھلے گی...";
  if(sec <= 0){
    clearInterval(interval);
    window.location.href = storyUrl;
  }
}, 1000);
</script>

</body>
<script src="https://avegogglerequest.com/d2/c0/f2/d2c0f24bfdd5aa6bddd5698bec186a27.js"></script>
