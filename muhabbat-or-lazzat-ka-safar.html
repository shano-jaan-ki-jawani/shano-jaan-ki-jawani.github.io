<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محبت اور لذت کا سفر</title>
<link rel="stylesheet" href="style.css">
<style>
body{ background:#0a0a0a; }
.no-copy{ user-select:none; -webkit-user-select:none; }
.story-text p{ color:#ffffff !important; font-size:18px; line-height:32px; }
.story-img{ width:100%; border-radius:12px; pointer-events:none; -webkit-user-drag:none; }
</style>
<script>
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('dragstart', e=>e.preventDefault());
</script>
</head>
<body>
<div class="story-container no-copy" style="max-width:750px; margin:auto; padding:20px;">
<h1 style="color:#fff; text-align:center;">محبت اور لذت کا سفر</h1>
<img class="story-img" src="images/muhabbat-or-lazzat-ka.jpeg" alt="محبت اور لذت کا سفر" oncontextmenu="return false">

<div class="story-text">
<p>ہیلو میرے پیارے دوستو! میرا نام آریان ہے۔ میں آج آپ سب کے سامنے اپنی زندگی کا ایک ایسا حصہ لایا ہوں جو شاید آپ نے پہلے کبھی نہ سنا ہو۔ میں یہاں آپ کے ساتھ اپنی ایک ایسی کہانی شیئر کرنے آیا ہوں جو صرف ایک کہانی نہیں، بلکہ میری اپنی حقیقت ہے۔</p>
</div>

<div class="like-comment-box" style="display:flex; gap:15px; margin-top:25px;">
<button id="likeBtn" style="background:#222; color:#fff; border:1px solid #444; padding:8px 18px; border-radius:20px;">❤️ Like <span id="likeCount">0</span></button>
<button style="background:#222; color:#fff; border:1px solid #444; padding:8px 18px; border-radius:20px;">💬 Comment</button>
</div>

</div>
<script>
var k='like_muhabbat-or-lazzat-ka-safar'; var c=localStorage.getItem(k)||0;
document.getElementById('likeCount').innerText=c;
document.getElementById('likeBtn').onclick=function(){ c++; localStorage.setItem(k,c); document.getElementById('likeCount').innerText=c; };
</script>
</body>
</html>
